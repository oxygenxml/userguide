<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="590" viewBox="0 50 980 590">
  <title id="title">Content Fusion deployment architecture</title>
  <desc id="desc">Browsers and Oxygen XML Author connect over HTTPS to a Content Fusion server running on a single Linux host. The server includes an NGINX web tier, core platform services, PostgreSQL with backups, and Redis cache. Optional outbound integrations include SMTP, LDAP or Active Directory, OIDC SSO, Git or GitLab, and AI or LLM providers.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#315a8a"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feOffset in="blur" dx="0" dy="2" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.18" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style type="text/css"><![CDATA[
      .title { font: 700 22px Arial, Helvetica, sans-serif; fill: #1f2d3d; }
      .label { font: 600 16px Arial, Helvetica, sans-serif; fill: #1f2d3d; }
      .small { font: 13px Arial, Helvetica, sans-serif; fill: #3b4a5a; }
      .tiny { font: 12px Arial, Helvetica, sans-serif; fill: #536271; }
      .box { fill: #ffffff; stroke: #466f9f; stroke-width: 2; rx: 10; filter: url(#shadow); }
      .server { fill: #f7fbff; stroke: #315a8a; stroke-width: 2.5; rx: 14; filter: url(#shadow); }
      .inner { fill: #ffffff; stroke: #6c8fb5; stroke-width: 1.8; rx: 10; }
      .data { fill: #fef7e8; stroke: #b77819; stroke-width: 1.8; rx: 10; }
      .cache { fill: #f2fbf2; stroke: #498a49; stroke-width: 1.8; rx: 10; }
      .line { stroke: #315a8a; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .internal { stroke: #6c8fb5; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #8a99a8; stroke-width: 1.8; stroke-dasharray: 6 5; fill: none; marker-end: url(#arrow); }
      .divider { stroke: #c6d2df; stroke-width: 1; }
    ]]></style>
  </defs>

  <rect width="980" height="640" fill="#ffffff"/>
  <!-- Clients -->
  <rect class="box" x="50" y="82" width="190" height="95"/>
  <text class="label" x="145" y="120" text-anchor="middle">Browser</text>
  <text class="small" x="145" y="145" text-anchor="middle">Users / Admin</text>
  <text class="tiny" x="145" y="164" text-anchor="middle">reviewers, authors, administrators</text>

  <rect class="box" x="50" y="260" width="190" height="105"/>
  <text class="label" x="145" y="295" text-anchor="middle">Oxygen XML Author</text>
  <text class="small" x="145" y="319" text-anchor="middle">desktop client</text>
  <text class="tiny" x="145" y="340" text-anchor="middle">via Content Fusion connector</text>

  <!-- Server boundary -->
  <rect class="server" x="345" y="82" width="585" height="370"/>
  <text class="label" x="637" y="116" text-anchor="middle">CONTENT FUSION SERVER</text>
  <text class="small" x="637" y="138" text-anchor="middle">single Linux host</text>

  <!-- Server tiers -->
  <rect class="inner" x="405" y="165" width="465" height="76"/>
  <text class="label" x="637" y="194" text-anchor="middle">Web tier (NGINX)</text>
  <text class="small" x="637" y="218" text-anchor="middle">Static UI · HTTPS termination · proxy</text>

  <rect class="inner" x="405" y="285" width="465" height="70"/>
  <text class="label" x="637" y="327" text-anchor="middle">Core platform services</text>

  <rect class="data" x="435" y="385" width="170" height="56"/>
  <text class="label" x="520" y="419" text-anchor="middle">PostgreSQL</text>

  <rect class="cache" x="670" y="385" width="170" height="56"/>
  <text class="label" x="755" y="419" text-anchor="middle">Cache</text>

  <!-- Connections -->
  <path class="line" d="M 240 128 H 345"/>
  <text class="small" x="292" y="116" text-anchor="middle">HTTPS</text>

  <path class="line" d="M 240 313 H 345"/>
  <text class="small" x="292" y="301" text-anchor="middle">HTTPS</text>

  <path class="internal" d="M 637 241 V 285"/>
  <text class="tiny" x="654" y="266">internal network</text>

  <path class="internal" d="M 575 355 V 385"/>
  <path class="internal" d="M 700 355 V 385"/>

  <!-- Optional integrations -->
  <line class="divider" x1="50" y1="500" x2="930" y2="500"/>
  <text class="label" x="50" y="532">Optional outbound integrations</text>
  <text class="small" x="50" y="555">Each can be disabled — air-gap capable</text>

  <g transform="translate(50 578)">
    <rect class="inner" x="0" y="0" width="145" height="36"/>
    <text class="small" x="72" y="23" text-anchor="middle">Corporate SMTP</text>
    <rect class="inner" x="160" y="0" width="190" height="36"/>
    <text class="small" x="255" y="23" text-anchor="middle">LDAP / Active Directory</text>
    <rect class="inner" x="365" y="0" width="150" height="36"/>
    <text class="small" x="440" y="23" text-anchor="middle">OIDC SSO provider</text>
    <rect class="inner" x="530" y="0" width="150" height="36"/>
    <text class="small" x="605" y="23" text-anchor="middle">Git servers</text>
    <rect class="inner" x="695" y="0" width="180" height="36"/>
    <text class="small" x="785" y="23" text-anchor="middle">AI provider</text>
  </g>

  <path class="dash" d="M 637 452 V 500"/>
</svg>
